services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: ai-product-backend

    env_file:
      - .env

    environment:
      PORT: 8000

    ports:
      - "8001:8000"

    volumes:
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: ai-product-frontend

    environment:
      API_BASE_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
